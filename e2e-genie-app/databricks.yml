bundle:
  name: genie-e2e-app

# ⚠️ UPDATE THESE
variables:
  serving_endpoint_name:
    description: "Name of the model serving endpoint to be used by the app"
    default: "mas-cfcbc058-endpoint"
  genie_space_id:
    description: "Space ID of the Genie space to be used by the app"
    default: "01f0aabba63a1803b37ff594a8a4b01e"
  database_instance_name:
    description: "Base name of the Lakebase database instance"
    default: "lakebase-e2e"
  resource_name_suffix:
    description: "Suffix for resource names (app/lakebase instance names etc). Helpful for avoiding name collisions if multiple users deploy this app to the same workspace"
    default: "lce"

resources:
  database_instances:
    chatbot_lakebase:
      # UPDATE THIS: customize the Lakebase instance name here, if desired
      name: ${var.database_instance_name}-${var.resource_name_suffix}
      capacity: CU_1

  apps:
    databricks_chatbot:
      # UPDATE THIS: customize the app name here, if desired
      name: genie-e2e-app-lce
      description: "Agentic Chat application for Genie Space"
      source_code_path: .
      user_api_scopes:
        - serving.serving-endpoints
        - sql
      resources:
        - name: serving-endpoint
          description: "Databricks serving endpoint name for the AI agent"
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: database
          description: "Lakebase database instance for the chat app"
          database:
            database_name: databricks_postgres
            instance_name: ${resources.database_instances.chatbot_lakebase.name}
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    mode: development
    default: true
    variables:
      resource_name_suffix: "dev"

  staging:
    mode: production
    variables:
      resource_name_suffix: "staging"

  prod:
    mode: production
    variables:
      resource_name_suffix: "prod"
