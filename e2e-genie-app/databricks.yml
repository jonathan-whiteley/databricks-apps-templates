bundle:
  name: lce-genie-poc

variables:
  serving_endpoint_name:
    description: "Name of the model serving endpoint to be used by the app"
    default: "mas-cfcbc058-endpoint"
  genie_space_id:
    description: "Space ID of the Genie space to be used by the app"
    default: "01f0aae3f2a812ceb9f489fa0317532a"

resources:
  apps:
    databricks_chatbot:
      name: lce-genie-poc
      description: "LCE Genie E2E Chat Application"
      source_code_path: .
      user_api_scopes:
        - serving.serving-endpoints
        - sql
        - dashboards.genie
      resources:
        - name: serving-endpoint
          description: "Databricks serving endpoint name for the AI agent"
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: database
          description: "Lakebase database instance for the chat app"
          database:
            database_name: databricks_postgres
            instance_name: lce-gda-de-genie-poc
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    mode: development
    default: true
