bundle:
  name: flightsafety_e2e

variables:
  serving_endpoint_name:
    description: "Name of the MAS serving endpoint"
    default: "mas-71d28e24-endpoint"
  database_instance_name:
    description: "Base name of the Lakebase database instance"
    default: "flightsafety-lakebase"
  catalog_name:
    description: "Unity Catalog name for FlightSafety demo data"
    default: "flightsafety_demo"
  schema_name:
    description: "Schema name within the catalog"
    default: "core"
  volume_name:
    description: "Volume name for simulator discrepancy PDFs"
    default: "simulator_issue_docs"

resources:
  schemas:
    flightsafety_schema:
      catalog_name: ${var.catalog_name}
      name: ${var.schema_name}
      comment: "FlightSafety simulator demo data"

  volumes:
    flightsafety_pdfs:
      catalog_name: ${var.catalog_name}
      schema_name: ${resources.schemas.flightsafety_schema.name}
      name: ${var.volume_name}
      volume_type: MANAGED
      comment: "Simulator discrepancy PDF documents for KA endpoint"

  jobs:
    bootstrap_data:
      name: flightsafety-bootstrap-data
      description: "One-shot job: create tables and generate PDFs into volume"
      tasks:
        - task_key: generate_fact_tables
          spark_python_task:
            python_file: scripts/generate_flightsafety_data.py
          environment_key: bootstrap_env
        - task_key: generate_pdfs
          depends_on:
            - task_key: generate_fact_tables
          spark_python_task:
            python_file: scripts/generate_flightsafety_pdfs.py
          environment_key: bootstrap_env
      environments:
        - environment_key: bootstrap_env
          spec:
            client: "2"
            dependencies:
              - databricks-sdk
              - fpdf2
      parameters:
        - name: FLIGHTSAFETY_CATALOG
          default: ${var.catalog_name}
        - name: FLIGHTSAFETY_SCHEMA
          default: ${var.schema_name}
        - name: FLIGHTSAFETY_VOLUME
          default: ${var.volume_name}

  database_instances:
    chatbot_lakebase:
      name: ${var.database_instance_name}
      capacity: CU_1

  apps:
    databricks_chatbot:
      name: flightsafety-e2e
      description: "FlightSafety simulator operations chatbot"
      source_code_path: .
      user_api_scopes:
        - serving.serving-endpoints
        - sql
        - dashboards.genie
      resources:
        - name: serving-endpoint
          description: "MAS serving endpoint for the AI agent"
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: database
          description: "Lakebase database instance for chat history"
          database:
            database_name: databricks_postgres
            instance_name: ${resources.database_instances.chatbot_lakebase.name}
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT
