bundle:
  name: flightsafety_e2e

variables:
  serving_endpoint_name:
    description: "Name of the MAS serving endpoint"
    default: "mas-71d28e24-endpoint"
  database_instance_name:
    description: "Base name of the Lakebase database instance"
    default: "flightsafety-lakebase"

resources:
  database_instances:
    chatbot_lakebase:
      name: ${var.database_instance_name}
      capacity: CU_1

  apps:
    databricks_chatbot:
      name: flightsafety-e2e
      description: "FlightSafety simulator operations chatbot"
      source_code_path: .
      user_api_scopes:
        - serving.serving-endpoints
        - sql
        - dashboards.genie
      resources:
        - name: serving-endpoint
          description: "MAS serving endpoint for the AI agent"
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: database
          description: "Lakebase database instance for chat history"
          database:
            database_name: databricks_postgres
            instance_name: ${resources.database_instances.chatbot_lakebase.name}
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT
